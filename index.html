<style>
:root{--bg:#080705;--bg2:#0f0d09;--bg3:#161310;--border:rgba(139,115,85,0.18);--border2:rgba(139,115,85,0.32);--gold:#8B7355;--gold2:#C4A882;--gold3:#E8D5B0;--dim:#5A4A35;--dimmer:#3A2A1A;--green:#4A7C59;--green2:#6B8F71;--red:#8B3A3A;--red2:#C45A5A;--orange:#8B5A2A;--orange2:#C4823C;--blue:#2A4A6B;--blue2:#4A7AAB;--purple:#5A3A7A;--purple2:#8A6AAA;--s1:#8B7355;--s2:#C17D3C;--s3:#6B8F71;--s4:#4A7C59;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--gold2);font-family:"DM Sans",sans-serif;min-height:100vh;overflow-x:hidden;}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(8,7,5,0.97);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-btn{flex:1;padding:12px 4px 10px;background:none;border:none;cursor:pointer;color:var(--dim);font-size:9px;letter-spacing:1px;font-family:"DM Mono",monospace;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 0.2s;}
.nav-btn.active{color:var(--gold2);}
.nav-btn svg{width:20px;height:20px;}
.header{padding:54px 20px 16px;border-bottom:1px solid var(--border);}
.header-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:4px;color:var(--dim);margin-bottom:4px;}
.header-title{font-family:"Playfair Display",serif;font-size:28px;color:var(--gold3);line-height:1.1;}
.header-sub{font-size:12px;color:var(--dim);margin-top:4px;}
.section{padding:16px;}
.section-title{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:12px;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;}
.card-accent-green{border-left:3px solid var(--green2);}
.card-accent-gold{border-left:3px solid var(--gold);}
.card-accent-red{border-left:3px solid var(--red2);}
.card-accent-orange{border-left:3px solid var(--orange2);}
.card-accent-purple{border-left:3px solid var(--purple2);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px 10px;text-align:center;}
.stat-val{font-family:"Playfair Display",serif;font-size:24px;color:var(--gold3);line-height:1;}
.stat-val.green{color:var(--green2);}.stat-val.orange{color:var(--orange2);}.stat-val.purple{color:var(--purple2);}
.stat-lbl{font-family:"DM Mono",monospace;font-size:8px;letter-spacing:2px;color:var(--dim);margin-top:4px;}
.succ-bar{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px;}
.succ-track{display:flex;margin-top:10px;}
.succ-step{flex:1;text-align:center;}
.succ-line{height:3px;background:var(--border);}
.succ-line.active{background:var(--green2);}
.succ-dot{width:10px;height:10px;border-radius:50%;background:var(--border);margin:-6px auto 6px;}
.succ-dot.active{background:var(--green2);}
.succ-dot.current{background:var(--green2);box-shadow:0 0 10px rgba(107,143,113,0.6);border:2px solid var(--gold3);}
.succ-lbl{font-family:"DM Mono",monospace;font-size:8px;color:var(--dimmer);letter-spacing:1px;}
.succ-lbl.active{color:var(--green2);}
.succ-species{font-size:8px;color:var(--dimmer);margin-top:2px;line-height:1.3;}
.form-group{margin-bottom:12px;}
.form-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:2px;color:var(--dim);display:block;margin-bottom:5px;}
.form-input,.form-select,.form-textarea{width:100%;background:rgba(15,13,9,0.9);border:1px solid var(--border2);border-radius:4px;color:var(--gold2);padding:10px 12px;font-size:14px;font-family:"DM Sans",sans-serif;-webkit-appearance:none;appearance:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);}
.form-textarea{height:80px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{padding:11px 18px;border-radius:5px;cursor:pointer;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:2px;border:none;font-weight:500;transition:all 0.2s;}
.btn-primary{background:rgba(107,143,113,0.2);border:1px solid rgba(107,143,113,0.4);color:var(--green2);}
.btn-gold{background:rgba(139,115,85,0.2);border:1px solid rgba(139,115,85,0.4);color:var(--gold2);}
.btn-danger{background:rgba(139,58,58,0.15);border:1px solid rgba(139,58,58,0.3);color:var(--red2);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--dim);}
.btn-sm{padding:6px 12px;font-size:9px;}
.btn-full{width:100%;}
.pill{display:inline-block;padding:3px 8px;border-radius:3px;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1px;white-space:nowrap;}
.pill-green{background:rgba(74,124,89,0.2);border:1px solid rgba(74,124,89,0.3);color:var(--green2);}
.pill-red{background:rgba(139,58,58,0.2);border:1px solid rgba(139,58,58,0.3);color:var(--red2);}
.pill-orange{background:rgba(139,90,42,0.2);border:1px solid rgba(139,90,42,0.3);color:var(--orange2);}
.pill-gold{background:rgba(139,115,85,0.2);border:1px solid rgba(139,115,85,0.3);color:var(--gold2);}
.pill-purple{background:rgba(90,58,122,0.2);border:1px solid rgba(90,58,122,0.3);color:var(--purple2);}
.pill-blue{background:rgba(42,74,107,0.2);border:1px solid rgba(42,74,107,0.3);color:var(--blue2);}
.pill-gray{background:rgba(80,70,55,0.2);border:1px solid rgba(80,70,55,0.3);color:var(--dim);}
.collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.collapse-arrow{color:var(--dim);transition:transform 0.2s;font-size:12px;}
.collapse-arrow.open{transform:rotate(180deg);}
.collapse-body{overflow:hidden;transition:max-height 0.3s ease;max-height:0;}
.collapse-body.open{max-height:3000px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px 16px 0 0;width:100%;max-width:480px;margin:0 auto;padding:20px 16px 40px;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s ease;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:"Playfair Display",serif;font-size:20px;color:var(--gold3);margin-bottom:16px;}
.species-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden;}
.species-card-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.species-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.species-name{font-size:13px;color:var(--gold2);font-style:italic;flex:1;}
.species-card-body{padding:0 14px 14px;border-top:1px solid var(--border);}
.photo-box{width:100%;aspect-ratio:4/3;background:var(--bg2);border:1px dashed var(--border2);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;margin-bottom:10px;}
.photo-box-label{font-family:"DM Mono",monospace;font-size:9px;color:var(--dim);letter-spacing:2px;}
.log-entry{background:var(--bg3);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden;}
.log-entry-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.log-day{font-family:"Playfair Display",serif;font-size:22px;color:var(--gold3);min-width:36px;}
.cult-stage-btn{padding:5px 10px;border-radius:3px;cursor:pointer;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1px;background:transparent;border:1px solid var(--border);color:var(--dim);}
.cult-stage-btn.active{background:rgba(107,143,113,0.2);border-color:rgba(107,143,113,0.4);color:var(--green2);}
.alert{padding:10px 12px;border-radius:4px;font-size:12px;margin-bottom:10px;line-height:1.5;}
.alert-warn{background:rgba(139,90,42,0.15);border:1px solid rgba(139,90,42,0.3);color:var(--orange2);}
.alert-info{background:rgba(42,74,107,0.15);border:1px solid rgba(42,74,107,0.3);color:var(--blue2);}
.empty{text-align:center;padding:40px 20px;color:var(--dimmer);font-family:"DM Mono",monospace;font-size:11px;letter-spacing:2px;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--green2);color:var(--green2);padding:10px 20px;border-radius:20px;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:2px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}
.flex{display:flex;}.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-8{gap:8px;}.wrap{flex-wrap:wrap;}
.small{font-size:11px;}.tiny{font-size:9px;letter-spacing:1px;}.dim{color:var(--dim);}
.gold3{color:var(--gold3);}.serif{font-family:"Playfair Display",serif;}
</style>
</head>
<body>

  <div class="modal-overlay" id="modal-log-entry"><div class="modal"><div class="modal-handle"></div><div class="modal-title" id="modal-log-title">Field Log Entry</div><div id="modal-log-content"></div></div></div>
  <div class="modal-overlay" id="modal-species"><div class="modal"><div class="modal-handle"></div><div class="modal-title" id="modal-species-title">Add Species</div><div id="modal-species-content"></div></div></div>
  <div class="modal-overlay" id="modal-harvest"><div class="modal"><div class="modal-handle"></div><div class="modal-title">Log Harvest</div><div id="modal-harvest-content"></div></div></div>
  <div class="modal-overlay" id="modal-lab"><div class="modal"><div class="modal-handle"></div><div class="modal-title">New Cultivation Run</div><div id="modal-lab-content"></div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
// ============================================================
// STORAGE
// ============================================================
var DB = {
  get: function(k) { try { return JSON.parse(localStorage.getItem("rtb_"+k)||"null"); } catch(e) { return null; } },
  set: function(k,v) { try { localStorage.setItem("rtb_"+k,JSON.stringify(v)); } catch(e) { showToast("Storage full - try smaller photos"); } }
};
function getData(k,def) { var v=DB.get(k); return v!==null?v:def; }
function setData(k,v) { DB.set(k,v); }

// ============================================================
// CONSTANTS
// ============================================================
var LOCATIONS = ["Horse Hay Area","Goat Play Area","Front Gate","OG Pile - Front Left","OG Pile - Front Right","OG Pile - Back Left","OG Pile - Back Right","New Pile Behind Barn","Back Fence Line","Behind Barn","Front Facing Barn","Other"];
var ABUNDANCE = ["first appearance","solitary","few","several","clusters","massive clusters","fading","gone"];
var EDIBILITY = ["edible","edible - caution","inedible","TOXIC","unknown"];
var TOXICITY = ["none","low","moderate","HIGH - GI","HIGH - amatoxins","HIGH - other"];
var GUILDS = ["coprophilous","saprotrophic","mycorrhizal","parasitic","unknown"];
var SUCC_LABELS = ["","Early","Mid","Late/Pre-Cube","PEAK - Cubensis"];
var SUCC_COLORS = ["","#8B7355","#C17D3C","#6B8F71","#4A7C59"];
var SUCC_SPECIES = ["","Pan ant / Ink caps","Mottlegills / Bolbitius","Conocybe / Fading pioneers","P. cubensis active"];
var CULT_STAGES = ["Spore Print","Spore Syringe","Agar Work","Grain Spawn","Bulk Substrate","Pinning","Fruiting","Harvest Complete","Failed"];
var CULT_METHODS = ["Spore Print to Agar","Spore Print to Syringe","Agar to Grain","Grain to Bulk","PF Tek","Other"];

// ============================================================
// INIT - SAFE, NEVER OVERWRITES USER DATA
// ============================================================
function initData() {
  if (!DB.get("log_entries")) setData("log_entries",[]);
  if (!DB.get("harvests")) setData("harvests",[]);
  if (!DB.get("lab_runs")) setData("lab_runs",[]);
  var DEFAULT_SPECIES = [
    {id:"default_1",name:"Panaeolus antillarum",commonName:"Dunce Cap / Cracked Cap",guild:"coprophilous",edibility:"inedible",toxicity:"none",psychoactive:false,firstSeen:"2025-05-19",lastSeen:"",locations:["Horse Hay Area","Goat Play Area","Front Gate","OG Pile - Back Left","New Pile Behind Barn","Back Fence Line","Front Facing Barn"],substrate:"Horse/donkey manure",succStage:1,notes:"Dominant pioneer species. Appears first after rain on fresh-aged manure. White cap cracks in heat. Black spore print. When peaking and fading, cubensis pins are typically 5-14 days out. Pan ant to cone cap ratio is a key succession signal.",photo:null,color:"#8B7355"},
    {id:"default_2",name:"Ink Cap (Coprinellus sp.)",commonName:"Inky Cap",guild:"coprophilous",edibility:"inedible",toxicity:"low",psychoactive:false,firstSeen:"2025-05-19",lastSeen:"",locations:["Horse Hay Area","Behind Barn","New Pile Behind Barn"],substrate:"Old manure / decaying organic matter",succStage:1,notes:"Fast fruiting, autoliquefies into black ink quickly. Early succession companion to pan ant. Tolerates wider decomposition range.",photo:null,color:"#2C2C2C"},
    {id:"default_3",name:"Panaeolus papilionaceus",commonName:"Petticoat Mottlegill",guild:"coprophilous",edibility:"inedible",toxicity:"low",psychoactive:false,firstSeen:"2025-05-26",lastSeen:"",locations:["Horse Hay Area"],substrate:"Manure",succStage:2,notes:"Close relative of pan ant. Mid-succession indicator. Distinguished by toothed gill edges. Mildly psychoactive in some populations but inconsistently.",photo:null,color:"#9B7E6E"},
    {id:"default_4",name:"Bolbitius coprophilus",commonName:"Dung Fieldcap",guild:"coprophilous",edibility:"inedible",toxicity:"none",psychoactive:false,firstSeen:"2025-05-27",lastSeen:"",locations:["New Pile Behind Barn"],substrate:"Fresh/active manure",succStage:2,notes:"Rusty red/pink when young pins, turns brown when mature. Good mid-succession dung marker. First appeared on new barn pile.",photo:null,color:"#C17D3C"},
    {id:"default_5",name:"Conocybe sp. (Milky Cone Cap)",commonName:"Milky Cone Cap",guild:"coprophilous",edibility:"TOXIC",toxicity:"HIGH - amatoxins",psychoactive:false,firstSeen:"2025-05-26",lastSeen:"",locations:["Horse Hay Area"],substrate:"Manure / enriched soil",succStage:3,notes:"DANGER: Some Conocybe species contain amatoxins identical to death caps. Grows in exact same substrate as cubensis. NEVER consume. KEY INDICATOR: first appearance signals you are in the late pre-cubensis window.",photo:null,color:"#D4C5A9"},
    {id:"default_6",name:"Chlorophyllum molybdites",commonName:"False Parasol / Green-Spored Lepiota",guild:"saprotrophic",edibility:"TOXIC",toxicity:"HIGH - GI",psychoactive:false,firstSeen:"2025-05-26",lastSeen:"",locations:["OG Pile - Back Left"],substrate:"Soil / disturbed ground near manure",succStage:2,notes:"TOXIC: Most commonly eaten poisonous mushroom in N. America. Severe vomiting and diarrhea. KEY ID: dull green spore print. Loves Florida lawns and disturbed humid ground. DO NOT eat.",photo:null,color:"#7A9E5F"}
  ];
  var existing = DB.get("species") || [];
  var existingNames = {};
  for (var i=0;i<existing.length;i++) existingNames[existing[i].name]=true;
  var added = false;
  for (var j=0;j<DEFAULT_SPECIES.length;j++) {
    if (!existingNames[DEFAULT_SPECIES[j].name]) { existing.push(DEFAULT_SPECIES[j]); added=true; }
  }
  if (added || !DB.get("species")) setData("species",existing);
}

// ============================================================
// PHOTO COMPRESSION
// ============================================================
function compressPhoto(dataUrl, maxW, quality, cb) {
  var img = new Image();
  img.onload = function() {
    var w=img.width, h=img.height;
    if (w>maxW) { h=Math.round(h*maxW/w); w=maxW; }
    var canvas=document.createElement("canvas");
    canvas.width=w; canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    cb(canvas.toDataURL("image/jpeg",quality));
  };
  img.src=dataUrl;
}
function compressAndPreview(input, previewId, placeholderId, cb) {
  var file=input.files[0]; if (!file) return;
  var reader=new FileReader();
  reader.onload=function(e) {
    compressPhoto(e.target.result,800,0.7,function(compressed) {
      var preview=document.getElementById(previewId);
      var placeholder=document.getElementById(placeholderId);
      if (preview) { preview.src=compressed; preview.style.display="block"; }
      if (placeholder) placeholder.style.display="none";
      if (cb) cb(compressed);
    });
  };
  reader.readAsDataURL(file);
}

// ============================================================
// UTILITIES
// ============================================================
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function showToast(msg) { var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},2500); }
function openModal(id) { document.getElementById(id).classList.add("open"); document.body.style.overflow="hidden"; }
function closeModal(id) { document.getElementById(id).classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("click",function(e){ if(e.target.classList.contains("modal-overlay")) closeModal(e.target.id); });
function formatDate(d) { if(!d) return "-"; var dt=new Date(d+"T12:00:00"); return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function toggle(id) { var el=document.getElementById(id); var arr=document.getElementById(id+"_arrow"); if(el) el.classList.toggle("open"); if(arr) arr.classList.toggle("open"); }

function getToxicityClass(t) {
  if (!t||t==="none") return "pill-green";
  if (t==="low") return "pill-gold";
  if (t.indexOf("HIGH")>-1) return "pill-red";
  return "pill-orange";
}
function getEdibilityClass(e) {
  if (e==="edible") return "pill-green";
  if (e==="edible - caution") return "pill-orange";
  if (e==="TOXIC") return "pill-red";
  return "pill-gray";
}

// ============================================================
// BACKUP / RESTORE
// ============================================================
function exportData() {
  var data = { exported:new Date().toISOString(), log_entries:getData("log_entries",[]), species:getData("species",[]), harvests:getData("harvests",[]), lab_runs:getData("lab_runs",[]) };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="RTB-Myco-Backup-"+new Date().toISOString().split("T")[0]+".json"; a.click();
  URL.revokeObjectURL(url); showToast("Backup saved");
}
function importData(input) {
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e) {
    try {
      var data=JSON.parse(e.target.result);
      if(data.log_entries) setData("log_entries",data.log_entries);
      if(data.species) setData("species",data.species);
      if(data.harvests) setData("harvests",data.harvests);
      if(data.lab_runs) setData("lab_runs",data.lab_runs);
      showToast("Data restored");
      showView("dashboard");
    } catch(err) { showToast("Invalid backup file"); }
  };
  reader.readAsText(file);
}

// ============================================================
// ROUTER
// ============================================================
var VIEWS=["dashboard","log","shroomadex","harvest","lab"];
function showView(v) {
  VIEWS.forEach(function(name) {
    document.getElementById("view-"+name).style.display=name===v?"":"none";
    document.getElementById("nav-"+name).classList.toggle("active",name===v);
  });
  if(v==="dashboard") renderDashboard();
  if(v==="log") renderLog();
  if(v==="shroomadex") renderShroomadex();
  if(v==="harvest") renderHarvest();
  if(v==="lab") renderLab();
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  var entries=getData("log_entries",[]);
  var species=getData("species",[]);
  var harvests=getData("harvests",[]);
  var labRuns=getData("lab_runs",[]);
  var totalDays=entries.length;
  var totalObs=entries.reduce(function(s,e){return s+(e.observations?e.observations.length:0);},0);
  var spSet={};entries.forEach(function(e){(e.observations||[]).forEach(function(o){spSet[o.species]=1;});});
  var uniqueSp=Object.keys(spSet).length;
  var latest=entries.length?entries[entries.length-1]:null;
  var succStage=latest?latest.succStage:1;
  var totalWet=harvests.reduce(function(s,h){return s+Number(h.wetG||0);},0);
  var totalDry=harvests.reduce(function(s,h){return s+Number(h.dryG||0);},0);
  var seasonStart=entries.length?entries[0].date:"2025-05-19";
  var daysSince=Math.floor((new Date()-new Date(seasonStart+"T12:00:00"))/86400000)+1;
  var succColor=SUCC_COLORS[succStage]||"#8B7355";

  var weatherHtml="";
  if(entries.length>=3) {
    weatherHtml='<div class="section-title">RECENT WEATHER</div><div class="card" style="padding:10px 14px;"><div style="display:flex;gap:4px;overflow-x:auto;">';
    var recent=entries.slice(-7);
    recent.forEach(function(e){
      weatherHtml+='<div style="text-align:center;min-width:36px;flex:1;">';
      weatherHtml+='<div style="font-size:14px;">'+(e.rainfall?"&#127783;":"&#9728;")+"</div>";
      weatherHtml+='<div style="font-size:8px;color:var(--dim);">'+new Date(e.date+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"})+"</div>";
      weatherHtml+='<div style="font-size:9px;color:'+SUCC_COLORS[e.succStage]+';">S'+e.succStage+"</div></div>";
    });
    weatherHtml+="</div></div>";
  }

  var latestHtml="";
  if(latest) {
    latestHtml='<div class="section-title">LATEST: '+formatDate(latest.date)+'</div><div class="card card-accent-gold">';
    latestHtml+='<div class="flex gap-8 wrap" style="margin-bottom:8px;">';
    latestHtml+='<span class="pill pill-gold">'+latest.tempHigh+"/"+latest.tempLow+"F</span>";
    latestHtml+='<span class="pill '+(latest.rainfall?"pill-blue":"pill-gray")+'">'+(latest.rainfall?"Rain: "+latest.rainfallAmt:"No rain")+"</span></div>";
    var obs=latest.observations||[];
    obs.slice(0,3).forEach(function(o){
      latestHtml+='<div style="font-size:12px;color:var(--gold2);padding:2px 0;font-style:italic;">'+o.species+' <span style="color:var(--dim);font-style:normal;">- '+o.location+' - '+o.abundance+"</span></div>";
    });
    if(obs.length>3) latestHtml+='<div style="font-size:9px;color:var(--dim);margin-top:4px;">+'+(obs.length-3)+" more</div>";
    if(latest.notes) latestHtml+='<div class="divider"></div><div style="font-size:12px;color:var(--dim);line-height:1.5;">'+latest.notes+"</div>";
    latestHtml+="</div>";
  }

  var succTrack='<div class="succ-bar"><div class="section-title" style="margin:0 0 6px;">SUCCESSION STAGE</div>';
  succTrack+='<div style="font-size:12px;color:'+succColor+';margin-bottom:8px;">'+SUCC_LABELS[succStage]+" - "+SUCC_SPECIES[succStage]+"</div>";
  succTrack+='<div class="succ-track">';
  for(var si=1;si<=4;si++){
    var sc=SUCC_COLORS[si];
    succTrack+='<div class="succ-step"><div class="succ-line'+(si<=succStage?" active":"")+'"></div>';
    succTrack+='<div class="succ-dot'+(si<succStage?" active":si===succStage?" current":"")+'"></div>';
    succTrack+='<div class="succ-lbl'+(si<=succStage?" active":"")+'">'+SUCC_LABELS[si]+"</div>";
    succTrack+='<div class="succ-species">'+SUCC_SPECIES[si]+"</div></div>";
  }

}

function renderLog() {
  var entries=getData("log_entries",[]);
  var sorted=entries.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var html='<div class="header"><div class="header-label">FIELD LOG</div><div class="header-title">Daily Observations</div><div class="header-sub">'+entries.length+' entries - Season 2025</div></div><div class="section">';
  html+='<button class="btn btn-primary btn-full" style="margin-bottom:14px;" onclick="openLogModal()">+ LOG TODAY</button>';
  if(!sorted.length) html+='<div class="empty">NO ENTRIES YET</div>';
  var allSorted=entries.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  sorted.forEach(function(e){
    var dayNum=allSorted.findIndex(function(x){return x.id===e.id;})+1;
    html+=renderLogEntry(e,dayNum);
  });
  html+="</div>";
  document.getElementById("view-log").innerHTML=html;
}

function renderLogEntry(e,dayNum) {
  var id="log_"+e.id;
  var rainPill=e.rainfall?"pill-blue":"pill-gray";
  var rainText=e.rainfall?"Rain: "+e.rainfallAmt:"No rain";
  var sc=SUCC_COLORS[e.succStage]||"#8B7355";
  var out='<div class="log-entry"><div class="log-entry-header" data-id="'+id+'" onclick="toggle(this.dataset.id)">';
  out+='<div class="log-day">'+dayNum+"</div>";
  out+='<div style="flex:1;"><div style="font-size:13px;color:var(--gold2);">'+formatDate(e.date)+"</div>";
  out+='<div style="font-size:11px;color:var(--dim);">'+(e.observations?e.observations.length:0)+' obs - Stage '+e.succStage+"</div></div>";
  out+='<div class="flex gap-8 wrap">';
  out+='<span class="pill '+rainPill+'" style="font-size:9px;">'+(e.rainfall?"Rain":"Sun")+"</span>";
  out+='<span class="pill pill-gold" style="font-size:9px;">'+e.tempHigh+"F</span>";
  out+='<span class="pill" style="background:'+sc+'22;border:1px solid '+sc+'44;color:'+sc+';font-size:9px;">S'+e.succStage+"</span></div>";
  out+='<div class="collapse-arrow" id="'+id+'_arrow">v</div></div>';
  out+='<div class="collapse-body" id="'+id+'"><div style="padding:0 14px 14px;">';
  out+='<div class="flex gap-8 wrap" style="margin-bottom:10px;">';
  out+='<span class="pill pill-gold">'+e.tempHigh+"/"+e.tempLow+"F</span>";
  out+='<span class="pill '+rainPill+'">'+rainText+"</span>";
  out+='<span class="pill pill-gold">'+e.humidity+"</span></div>";
  out+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:8px;">OBSERVATIONS</div>';
  (e.observations||[]).forEach(function(o){
    out+='<div style="padding:6px 0;border-bottom:1px solid var(--border);">';
    out+='<div style="font-size:13px;color:var(--gold2);font-style:italic;">'+o.species+"</div>";
    out+='<div style="font-size:11px;color:var(--dim);">'+o.location+' - <span style="color:var(--green2);">'+o.abundance+"</span></div>";
    if(o.notes) out+='<div style="font-size:9px;color:var(--dim);margin-top:2px;">'+o.notes+"</div>";
    out+="</div>";
  });
  if(e.notes) out+='<div class="divider"></div><div style="font-size:12px;color:var(--dim);line-height:1.6;">'+e.notes+"</div>";
  out+='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">';
  out+='<button class="btn btn-gold btn-sm" onclick="openEditLogModal(this.dataset.id)" data-id="'+e.id+'">Edit</button>';
  out+='<button class="btn btn-ghost btn-sm" onclick="openLogPhotoModal(this.dataset.id)" data-id="'+e.id+'">Add Photo</button>';
  out+='<button class="btn btn-danger btn-sm" onclick="deleteLogEntry(this.dataset.id)" data-id="'+e.id+'">Delete</button>';
  out+="</div>";
  if(e.photos&&e.photos.length) {
    out+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">';
    e.photos.forEach(function(p,pi){
      out+='<div style="position:relative;"><img src="'+p+'" style="width:80px;height:80px;object-fit:cover;border-radius:4px;border:1px solid var(--border);">';
      out+='<button onclick="removeLogPhoto(this.dataset.eid,this.dataset.pi)" data-eid="'+e.id+'" data-pi="'+pi+'" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);border:none;color:var(--red2);font-size:10px;cursor:pointer;border-radius:2px;padding:1px 4px;">x</button></div>';
    });
    out+="</div>";
  }
  out+="</div></div></div>";
  return out;
}

function buildObsForm(observations) {
  var species=getData("species",[]);
  var spNames=["Panaeolus antillarum","Ink Cap (Coprinellus sp.)","Panaeolus papilionaceus","Bolbitius coprophilus","Conocybe sp. (Milky Cone Cap)","Chlorophyllum molybdites","Psilocybe cubensis","Unknown - needs ID"];
  species.forEach(function(s){if(spNames.indexOf(s.name)===-1)spNames.push(s.name);});
  var obs=observations||[{species:spNames[0],location:LOCATIONS[0],abundance:"",notes:""}];
  var out='<div class="flex-between" style="margin-bottom:10px;"><div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);">OBSERVATIONS</div><button class="btn btn-gold btn-sm" onclick="addObsRow()">+ ADD</button></div><div id="obs-rows">';
  obs.forEach(function(o){
    var rid="obs_"+uid();
    out+='<div id="'+rid+'" style="background:rgba(139,115,85,0.05);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:8px;">';
    out+='<div class="form-row" style="margin-bottom:8px;">';
    out+='<div><label class="form-label">SPECIES</label><select class="form-select" id="'+rid+'_sp">';
    spNames.forEach(function(s){out+='<option'+(o.species===s?' selected':'')+'>'+s+'</option>';});
    out+='<option'+(spNames.indexOf(o.species)===-1?' selected':'')+'>Other / New Species</option>';
    out+='</select></div>';
    out+='<div><label class="form-label">LOCATION</label><select class="form-select" id="'+rid+'_loc">';
    LOCATIONS.forEach(function(l){out+='<option'+(o.location===l?' selected':'')+'>'+l+'</option>';});
    out+='</select></div></div>';
    out+='<div class="form-row"><div><label class="form-label">ABUNDANCE</label><select class="form-select" id="'+rid+'_ab">';
    ABUNDANCE.forEach(function(a){out+='<option'+(o.abundance===a?' selected':'')+'>'+a+'</option>';});
    out+='</select></div>';
    out+='<div><label class="form-label">NOTES</label><input class="form-input" id="'+rid+'_notes" value="'+(o.notes||'')+'"></div></div>';
    out+='<button class="btn btn-danger btn-sm" style="margin-top:6px;" onclick="this.parentElement.remove()">Remove</button></div>';
  });
  return out+"</div>";
}

function addObsRow() {
  var species=getData("species",[]);
  var spNames=["Panaeolus antillarum","Ink Cap (Coprinellus sp.)","Panaeolus papilionaceus","Bolbitius coprophilus","Conocybe sp. (Milky Cone Cap)","Chlorophyllum molybdites","Psilocybe cubensis","Unknown - needs ID"];
  species.forEach(function(s){if(spNames.indexOf(s.name)===-1)spNames.push(s.name);});
  var rid="obs_"+uid();
  var row=document.createElement("div");
  row.id=rid;
  row.style.cssText="background:rgba(139,115,85,0.05);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:8px;";
  var html='<div class="form-row" style="margin-bottom:8px;"><div><label class="form-label">SPECIES</label><select class="form-select" id="'+rid+'_sp">';
  spNames.forEach(function(s){html+='<option>'+s+'</option>';});
  html+='<option>Other / New Species</option></select></div>';
  html+='<div><label class="form-label">LOCATION</label><select class="form-select" id="'+rid+'_loc">';
  LOCATIONS.forEach(function(l){html+='<option>'+l+'</option>';});
  html+='</select></div></div><div class="form-row"><div><label class="form-label">ABUNDANCE</label><select class="form-select" id="'+rid+'_ab">';
  ABUNDANCE.forEach(function(a){html+='<option>'+a+'</option>';});
  html+='</select></div><div><label class="form-label">NOTES</label><input class="form-input" id="'+rid+'_notes" placeholder="notes..."></div></div>';
  html+='<button class="btn btn-danger btn-sm" style="margin-top:6px;" onclick="this.parentElement.remove()">Remove</button>';
  row.innerHTML=html;
  document.getElementById("obs-rows").appendChild(row);
}

function getObsFromForm() {
  var rows=document.getElementById("obs-rows").children;
  var observations=[];
  for(var i=0;i<rows.length;i++){
    var rid=rows[i].id;
    observations.push({
      species:document.getElementById(rid+"_sp")?document.getElementById(rid+"_sp").value:"",
      location:document.getElementById(rid+"_loc")?document.getElementById(rid+"_loc").value:"",
      abundance:document.getElementById(rid+"_ab")?document.getElementById(rid+"_ab").value:"",
      notes:document.getElementById(rid+"_notes")?document.getElementById(rid+"_notes").value:""
    });
  }
  return observations;
}

function buildLogForm(e) {
  var today=new Date().toISOString().split("T")[0];
  var date=e?e.date:today;
  var stage=e?e.succStage:1;
  var hi=e?e.tempHigh:93;
  var lo=e?e.tempLow:80;
  var rain=e?e.rainfall:false;
  var rainAmt=e?e.rainfallAmt:"none";
  var hum=e?e.humidity:"high";
  var notes=e?e.notes:"";
  var out='<div class="form-row"><div class="form-group"><label class="form-label">DATE</label><input type="date" class="form-input" id="lf-date" value="'+date+'"></div>';
  out+='<div class="form-group"><label class="form-label">SUCC STAGE</label><select class="form-select" id="lf-stage">';
  for(var i=1;i<=4;i++) out+='<option value="'+i+'"'+(stage==i?" selected":"")+'>'+i+' - '+SUCC_LABELS[i]+'</option>';
  out+='</select></div></div>';
  out+='<div class="form-row"><div class="form-group"><label class="form-label">HIGH F</label><input type="number" class="form-input" id="lf-hi" value="'+hi+'"></div>';
  out+='<div class="form-group"><label class="form-label">LOW F</label><input type="number" class="form-input" id="lf-lo" value="'+lo+'"></div></div>';
  out+='<div class="form-row"><div class="form-group"><label class="form-label">RAINFALL</label><select class="form-select" id="lf-rain"><option value="false"'+(rain?"":" selected")+'>No Rain</option><option value="true"'+(rain?" selected":"")+'>Yes - Rain</option></select></div>';
  out+='<div class="form-group"><label class="form-label">AMOUNT</label><select class="form-select" id="lf-rainamt">';
  ["none","light","moderate","heavy","storm"].forEach(function(a){out+='<option'+(rainAmt===a?" selected":"")+'>'+a+'</option>';});
  out+='</select></div></div>';
  out+='<div class="form-group"><label class="form-label">HUMIDITY</label><select class="form-select" id="lf-humidity">';
  ["low","moderate","high","extreme"].forEach(function(h){out+='<option'+(hum===h?" selected":"")+'>'+h+'</option>';});
  out+='</select></div><div class="divider"></div>';
  out+=buildObsForm(e?e.observations:null);
  out+='<div class="divider"></div><div class="form-group"><label class="form-label">FIELD NOTES</label><textarea class="form-textarea" id="lf-notes">'+notes+'</textarea></div>';
  return out;
}

function openLogModal() {
  document.getElementById("modal-log-title").textContent="New Field Entry";
  document.getElementById("modal-log-content").innerHTML=buildLogForm(null)+
    '<div class="flex gap-8"><button class="btn btn-primary" style="flex:1;" onclick="saveLogEntry()">SAVE ENTRY</button><button class="btn btn-ghost" onclick="closeModal(\'modal-log-entry\')">CANCEL</button></div>';
  openModal("modal-log-entry");
}

function saveLogEntry() {
  var date=document.getElementById("lf-date").value;
  if(!date){showToast("Date required");return;}
  var entry={id:uid(),date:date,tempHigh:Number(document.getElementById("lf-hi").value),tempLow:Number(document.getElementById("lf-lo").value),rainfall:document.getElementById("lf-rain").value==="true",rainfallAmt:document.getElementById("lf-rainamt").value,humidity:document.getElementById("lf-humidity").value,succStage:Number(document.getElementById("lf-stage").value),observations:getObsFromForm(),notes:document.getElementById("lf-notes").value,photos:[]};
  var entries=getData("log_entries",[]);
  entries.push(entry);
  setData("log_entries",entries);
  closeModal("modal-log-entry");
  showToast("Entry saved");
  renderLog();
}

function openEditLogModal(id) {
  var entries=getData("log_entries",[]);
  var e=entries.find(function(x){return String(x.id)===String(id);});
  if(!e){showToast("Entry not found");return;}
  document.getElementById("modal-log-title").textContent="Edit Entry: "+formatDate(e.date);
  document.getElementById("modal-log-content").innerHTML=buildLogForm(e)+
    '<div class="flex gap-8"><button class="btn btn-primary" style="flex:1;" id="edit-log-save-btn">SAVE CHANGES</button><button class="btn btn-ghost" onclick="closeModal(\'modal-log-entry\')">CANCEL</button></div>';
  document.getElementById('edit-log-save-btn').addEventListener('click', function(){ saveEditLogEntry(id); });
  openModal("modal-log-entry");
}

function saveEditLogEntry(id) {
  var entries=getData("log_entries",[]);
  var idx=entries.findIndex(function(x){return String(x.id)===String(id);});
  if(idx===-1){showToast("Entry not found");return;}
  entries[idx]=Object.assign({},entries[idx],{date:document.getElementById("lf-date").value,tempHigh:Number(document.getElementById("lf-hi").value),tempLow:Number(document.getElementById("lf-lo").value),rainfall:document.getElementById("lf-rain").value==="true",rainfallAmt:document.getElementById("lf-rainamt").value,humidity:document.getElementById("lf-humidity").value,succStage:Number(document.getElementById("lf-stage").value),observations:getObsFromForm(),notes:document.getElementById("lf-notes").value});
  setData("log_entries",entries);
  closeModal("modal-log-entry");
  showToast("Entry updated");
  renderLog();
}

function openLogPhotoModal(id) {
  document.getElementById("modal-log-title").textContent="Add Photo to Entry";
  document.getElementById("modal-log-content").innerHTML=
    '<div class="photo-box" onclick="document.getElementById(\'lp-input\').click()" style="aspect-ratio:1;">'+
    '<img id="lp-preview" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:4px;">'+
    '<div id="lp-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--dim)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'+
    '<div class="photo-box-label">TAP TO SELECT PHOTO</div></div></div>'+
    '<input type="file" id="lp-input" accept="image/*" style="display:none;" onchange="compressAndPreview(this,\'lp-preview\',\'lp-placeholder\') ">'+
    '<div class="flex gap-8" style="margin-top:12px;"><button class="btn btn-primary" style="flex:1;" id="log-photo-save-btn">SAVE PHOTO</button><button class="btn btn-ghost" onclick="closeModal(\'modal-log-entry\')">CANCEL</button></div>';
  document.getElementById('log-photo-save-btn').addEventListener('click', function(){ saveLogPhoto(id); });
  openModal("modal-log-entry");
}

function saveLogPhoto(id) {
  var preview=document.getElementById("lp-preview");
  if(!preview||!preview.src||!preview.src.startsWith("data:")){showToast("Select a photo first");return;}
  var entries=getData("log_entries",[]);
  var idx=entries.findIndex(function(x){return String(x.id)===String(id);});
  if(idx===-1){showToast("Entry not found");return;}
  if(!entries[idx].photos) entries[idx].photos=[];
  entries[idx].photos.push(preview.src);
  setData("log_entries",entries);
  closeModal("modal-log-entry");
  showToast("Photo saved");
  renderLog();
}

function removeLogPhoto(entryId,photoIdx) {
  var entries=getData("log_entries",[]);
  var idx=entries.findIndex(function(x){return String(x.id)===String(entryId);});
  if(idx===-1) return;
  entries[idx].photos=(entries[idx].photos||[]).filter(function(_,i){return i!==Number(photoIdx);});
  setData("log_entries",entries);
  showToast("Photo removed");
  renderLog();
}

function deleteLogEntry(id) {
  if(!confirm("Delete this entry?")) return;
  var entries=getData("log_entries",[]).filter(function(e){return String(e.id)!==String(id);});
  setData("log_entries",entries);
  showToast("Deleted");
  renderLog();
}

function renderSpeciesCard(s) {

  out+='<div class="flex gap-8 wrap"><span class="pill '+edClass+'" style="font-size:8px;">'+(s.edibility||"")+"</span>";

  out+='<div class="flex gap-8 wrap" style="margin-bottom:10px;">';
  out+='<span class="pill '+getToxicityClass(s.toxicity)+'">'+(s.toxicity||"none")+'</span>';
  out+='<span class="pill pill-gold">'+(s.guild||"")+'</span>';
  if(s.psychoactive) out+='<span class="pill pill-purple">PSYCHOACTIVE</span>';
  out+='<span class="pill pill-gray">S'+(s.succStage||1)+'</span></div>';
  out+='<div class="form-row" style="margin-bottom:8px;">';
  out+='<div><div style="font-size:9px;color:var(--dim);">SUBSTRATE</div><div style="font-size:11px;color:var(--gold2);margin-top:2px;">'+(s.substrate||"-")+'</div></div>';
  out+='<div><div style="font-size:9px;color:var(--dim);">FIRST SEEN</div><div style="font-size:11px;color:var(--gold2);margin-top:2px;">'+(s.firstSeen?formatDate(s.firstSeen):"-")+'</div></div></div>';
  if(s.locations&&s.locations.length){
    out+='<div style="margin-bottom:8px;"><div style="font-size:9px;color:var(--dim);margin-bottom:4px;">LOCATIONS</div><div class="flex gap-8 wrap">';

  out+='<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">';

function getSpeciesFromForm(existing) {

    name:document.getElementById("sf-name").value.trim(),

    edibility:document.getElementById("sf-edibility").value,
    toxicity:document.getElementById("sf-toxicity").value,
    guild:document.getElementById("sf-guild").value,

    psychoactive:document.getElementById("sf-psycho").value==="true",

function saveSpecies() {

  var species=getData("species",[]);

function saveEditSpecies(id) {
  var species=getData("species",[]);
  var idx=species.findIndex(function(s){return String(s.id)===String(id);});

function renderHarvest() {
  var harvests=getData("harvests",[]);
  var sorted=harvests.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var totalWet=harvests.reduce(function(s,h){return s+Number(h.wetG||0);},0);
  var totalDry=harvests.reduce(function(s,h){return s+Number(h.dryG||0);},0);
  var totalPins=harvests.reduce(function(s,h){return s+Number(h.pinCount||0);},0);
  var monthly={};
  harvests.forEach(function(h){var m=h.date?h.date.slice(0,7):null;if(!m)return;if(!monthly[m])monthly[m]={wet:0,dry:0,count:0};monthly[m].wet+=Number(h.wetG||0);monthly[m].dry+=Number(h.dryG||0);monthly[m].count++;});
  var html='<div class="header"><div class="header-label">HARVEST TRACKER</div><div class="header-title">Psilocybe cubensis</div><div class="header-sub">Season 2025 - Wet and dry weights</div></div><div class="section">';
  html+='<button class="btn btn-primary btn-full" style="margin-bottom:14px;" onclick="openHarvestModal()">+ LOG HARVEST</button>';
  html+='<div class="stat-grid-3"><div class="stat-box"><div class="stat-val orange">'+totalWet.toFixed(1)+'</div><div class="stat-lbl">WET (g)</div></div><div class="stat-box"><div class="stat-val purple">'+totalDry.toFixed(1)+'</div><div class="stat-lbl">DRY (g)</div></div><div class="stat-box"><div class="stat-val green">'+totalPins+'</div><div class="stat-lbl">PINS</div></div></div>';
  if(Object.keys(monthly).length){
    html+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:12px;">MONTHLY BREAKDOWN</div>';
    Object.keys(monthly).sort().forEach(function(m){
      var d=monthly[m];
      html+='<div class="card card-accent-orange"><div class="flex-between"><div style="font-size:12px;color:var(--gold2);">'+new Date(m+"-15").toLocaleDateString("en-US",{month:"long",year:"numeric"})+'</div><div class="flex gap-8"><span class="pill pill-orange">'+d.wet.toFixed(1)+'g wet</span><span class="pill pill-purple">'+d.dry.toFixed(1)+'g dry</span></div></div><div style="font-size:9px;color:var(--dim);margin-top:4px;">'+d.count+' session'+(d.count!==1?'s':'')+'</div></div>';
    });
  }
  html+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:12px;">HARVEST LOG</div>';
  if(!sorted.length) html+='<div class="empty">NO HARVESTS YET</div>';
  sorted.forEach(function(h){
    var hid="harv_"+h.id;
    html+='<div class="card card-accent-green" style="margin-bottom:8px;"><div class="collapse-header" data-id="'+hid+'" onclick="toggle(this.dataset.id)">';
    html+='<div style="flex:1;"><div style="font-size:13px;color:var(--gold2);">'+formatDate(h.date)+'</div><div style="font-size:11px;color:var(--dim);">'+(h.location||"")+(h.flushNum?" - Flush #"+h.flushNum:"")+'</div></div>';
    html+='<div class="flex gap-8"><span class="pill pill-orange">'+h.wetG+'g wet</span>'+(h.dryG?'<span class="pill pill-purple">'+h.dryG+'g dry</span>':"")+'</div>';
    html+='<div class="collapse-arrow" id="'+hid+'_arrow">v</div></div>';
    html+='<div class="collapse-body" id="'+hid+'"><div style="padding-top:10px;">';
    html+='<div class="form-row"><div><div style="font-size:9px;color:var(--dim);">PINS</div><div style="font-size:13px;color:var(--gold3);">'+(h.pinCount||"-")+'</div></div>';
    html+='<div><div style="font-size:9px;color:var(--dim);">CLUSTER</div><div style="font-size:13px;color:var(--gold3);">'+(h.clusterSize||"-")+'</div></div>';
    html+='<div><div style="font-size:9px;color:var(--dim);">WET</div><div style="font-size:13px;color:var(--gold3);">'+h.wetG+'g</div></div>';
    html+='<div><div style="font-size:9px;color:var(--dim);">DRY</div><div style="font-size:13px;color:var(--gold3);">'+(h.dryG||"-")+'g</div></div></div>';
    if(h.maturity) html+='<div style="margin-top:6px;"><div style="font-size:9px;color:var(--dim);">MATURITY</div><div style="font-size:13px;color:var(--gold3);">'+h.maturity+'</div></div>';
    if(h.notes) html+='<div class="divider"></div><div style="font-size:12px;color:var(--dim);line-height:1.5;">'+h.notes+'</div>';
    if(h.photo) html+='<img src="'+h.photo+'" style="width:100%;border-radius:4px;margin-top:10px;aspect-ratio:4/3;object-fit:cover;">';

function renderLab() {
  var runs=getData("lab_runs",[]);
  var active=runs.filter(function(r){return r.stage!=="Harvest Complete"&&r.stage!=="Failed";});
  var done=runs.filter(function(r){return r.stage==="Harvest Complete"||r.stage==="Failed";});
  var html='<div class="header"><div class="header-label">CULTIVATION LAB</div><div class="header-title">Grow Experiments</div><div class="header-sub">'+runs.length+' runs total - '+active.length+' active</div></div><div class="section">';
  html+='<button class="btn btn-primary btn-full" style="margin-bottom:14px;" onclick="openLabModal()">+ NEW CULTIVATION RUN</button>';
  html+='<div class="alert alert-info">Track spore prints, agar work, grain spawn, and fruiting. Log each stage as it progresses.</div>';
  if(active.length){
    html+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:12px;">ACTIVE RUNS</div>';
    active.forEach(function(r){html+=renderLabRun(r);});
  } else { html+='<div class="empty" style="padding:20px 0;">NO ACTIVE RUNS</div>'; }
  if(done.length){
    html+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:3px;color:var(--dim);margin:14px 0 12px;">COMPLETED / FAILED</div>';
    done.forEach(function(r){html+=renderLabRun(r);});
  }
  html+="</div>";
  document.getElementById("view-lab").innerHTML=html;
}

function renderLabRun(r) {
  var rid="lab_"+r.id;
  var stageIdx=CULT_STAGES.indexOf(r.stage);
  var pct=Math.round((stageIdx/(CULT_STAGES.length-1))*100);
  var isFailed=r.stage==="Failed";
  var isComplete=r.stage==="Harvest Complete";
  var accentClass=isFailed?"card-accent-red":isComplete?"card-accent-green":"card-accent-purple";
  var pillClass=isFailed?"pill-red":isComplete?"pill-green":"pill-purple";
  var barColor=isFailed?"var(--red2)":"var(--purple2)";
  var out='<div class="card '+accentClass+'" style="margin-bottom:8px;">';
  out+='<div class="collapse-header" data-id="'+rid+'" onclick="toggle(this.dataset.id)">';
  out+='<div style="flex:1;"><div style="font-size:13px;color:var(--gold2);font-weight:600;">'+r.name+'</div><div style="font-size:9px;color:var(--dim);">'+(r.method||"")+" - Started "+(r.startDate?formatDate(r.startDate):"-")+'</div></div>';
  out+='<span class="pill '+pillClass+'">'+r.stage+'</span><div class="collapse-arrow" id="'+rid+'_arrow">v</div></div>';
  out+='<div style="margin-top:8px;height:3px;background:var(--border);border-radius:2px;"><div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:2px;"></div></div>';
  out+='<div class="collapse-body" id="'+rid+'"><div style="padding-top:12px;">';
  out+='<div class="form-row" style="margin-bottom:10px;">';
  out+='<div><div style="font-size:9px;color:var(--dim);">SOURCE</div><div style="font-size:12px;color:var(--gold3);">'+(r.source||"-")+'</div></div>';
  out+='<div><div style="font-size:9px;color:var(--dim);">STRAIN</div><div style="font-size:12px;color:var(--gold3);">'+(r.strain||"-")+'</div></div>';
  out+='<div><div style="font-size:9px;color:var(--dim);">CONTAINER</div><div style="font-size:12px;color:var(--gold3);">'+(r.container||"-")+'</div></div>';
  out+='<div><div style="font-size:9px;color:var(--dim);">INOCULATED</div><div style="font-size:12px;color:var(--gold3);">'+(r.innocDate?formatDate(r.innocDate):"-")+'</div></div></div>';
  out+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;">UPDATE STAGE</div>';
  out+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">';
  CULT_STAGES.forEach(function(s){
    out+='<button class="cult-stage-btn'+(r.stage===s?" active":"")+'" onclick="updateLabStage(this.dataset.id,this.dataset.stage)" data-id="'+r.id+'" data-stage="'+s+'">'+s+'</button>';
  });
  out+='</div>';
  out+='<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;">UPDATE LOG</div>';
  (r.updates||[]).slice().reverse().forEach(function(u){
    out+='<div style="padding:6px 0;border-bottom:1px solid var(--border);"><div style="font-size:9px;color:var(--purple2);">'+(u.date?formatDate(u.date):"")+" - "+u.stage+'</div><div style="font-size:12px;color:var(--gold2);margin-top:2px;">'+u.note+'</div></div>';
  });
  if(!(r.updates||[]).length) out+='<div style="font-size:9px;color:var(--dimmer);">No updates yet</div>';
  out+='<div class="form-row" style="margin-top:8px;"><input class="form-input" id="lab_note_'+r.id+'" placeholder="Add update note..."><button class="btn btn-gold btn-sm" onclick="addLabUpdate(this.dataset.id)" data-id="'+r.id+'">Log</button></div>';
  if(r.notes) out+='<div class="divider"></div><div style="font-size:12px;color:var(--dim);line-height:1.5;">'+r.notes+'</div>';
  out+='<div style="margin-top:10px;"><button class="btn btn-danger btn-sm" onclick="deleteLabRun(this.dataset.id)" data-id="'+r.id+'">Delete Run</button></div>';
  out+='</div></div></div>';
  return out;
}

function openLabModal() {
  var html='<div class="form-group"><label class="form-label">RUN NAME</label><input class="form-input" id="lb-name" placeholder="e.g. Wild Print #1 - Agar"></div>';
  html+='<div class="form-group"><label class="form-label">METHOD</label><select class="form-select" id="lb-method">';
  CULT_METHODS.forEach(function(m){html+='<option>'+m+'</option>';});
  html+='</select></div><div class="form-row"><div class="form-group"><label class="form-label">SOURCE</label><select class="form-select" id="lb-source"><option>Wild specimen - property</option><option>Spore print - self collected</option><option>Spore syringe - self made</option><option>Agar culture - self made</option><option>Other</option></select></div>';
  html+='<div class="form-group"><label class="form-label">STRAIN / ID</label><input class="form-input" id="lb-strain" placeholder="Wild FL #1"></div></div>';
  html+='<div class="form-row"><div class="form-group"><label class="form-label">START DATE</label><input type="date" class="form-input" id="lb-start" value="'+new Date().toISOString().split("T")[0]+'"></div>';
  html+='<div class="form-group"><label class="form-label">INOCULATION DATE</label><input type="date" class="form-input" id="lb-innoc"></div></div>';
  html+='<div class="form-group"><label class="form-label">CONTAINER</label><input class="form-input" id="lb-container" placeholder="petri dish, mason jar, tub..."></div>';
  html+='<div class="form-group"><label class="form-label">INITIAL STAGE</label><select class="form-select" id="lb-stage">';
  CULT_STAGES.slice(0,-2).forEach(function(s){html+='<option>'+s+'</option>';});
  html+='</select></div><div class="form-group"><label class="form-label">NOTES</label><textarea class="form-textarea" id="lb-notes" placeholder="Substrate recipe, conditions, goals..."></textarea></div>';
  html+='<div class="flex gap-8"><button class="btn btn-primary" style="flex:1;" onclick="saveLabRun()">CREATE RUN</button><button class="btn btn-ghost" onclick="closeModal(\'modal-lab\')">CANCEL</button></div>';
  document.getElementById("modal-lab-content").innerHTML=html;
  openModal("modal-lab");
}

function saveLabRun() {
  var name=document.getElementById("lb-name").value.trim();
  if(!name){showToast("Run name required");return;}
  var runs=getData("lab_runs",[]);
  runs.push({id:uid(),name:name,method:document.getElementById("lb-method").value,source:document.getElementById("lb-source").value,strain:document.getElementById("lb-strain").value,startDate:document.getElementById("lb-start").value,innocDate:document.getElementById("lb-innoc").value,container:document.getElementById("lb-container").value,stage:document.getElementById("lb-stage").value,notes:document.getElementById("lb-notes").value,updates:[]});
  setData("lab_runs",runs);
  closeModal("modal-lab");
  showToast("Lab run created");
  renderLab();
}

function updateLabStage(id,stage) {
  var runs=getData("lab_runs",[]);
  var run=runs.find(function(r){return String(r.id)===String(id);});
  if(run){run.stage=stage;run.updates=run.updates||[];run.updates.push({date:new Date().toISOString().split("T")[0],stage:stage,note:"Stage updated to: "+stage});}
  setData("lab_runs",runs);
  showToast("Stage updated");
  renderLab();
}

function addLabUpdate(id) {
  var note=document.getElementById("lab_note_"+id)?document.getElementById("lab_note_"+id).value.trim():"";
  if(!note) return;
  var runs=getData("lab_runs",[]);
  var run=runs.find(function(r){return String(r.id)===String(id);});
  if(run){run.updates=run.updates||[];run.updates.push({date:new Date().toISOString().split("T")[0],stage:run.stage,note:note});}
  setData("lab_runs",runs);
  showToast("Update logged");
  renderLab();
}

function deleteLabRun(id) {
  if(!confirm("Delete this cultivation run?")) return;
  var runs=getData("lab_runs",[]).filter(function(r){return String(r.id)!==String(id);});
  setData("lab_runs",runs);
  showToast("Run deleted");
  renderLab();
}

// ============================================================
// START
// ============================================================
initData();
showView("dashboard");
</script>
</body>
</html>
